name: Build IPA (TrollStore ready)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project LOLMViewDistance.xcodeproj \
            -scheme LOLMViewDistance \
            -configuration Release \
            -derivedDataPath /tmp/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p /tmp/Payload
          cp -r /tmp/build/Build/Products/Release-iphoneos/LOLMViewDistance.app /tmp/Payload/
          ldid -S /tmp/Payload/LOLMViewDistance.app/LOLMViewDistance
          cd /tmp && zip -r LOLMViewDistance.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOLMViewDistance-unsigned
          path: /tmp/LOLMViewDistance.ipa
