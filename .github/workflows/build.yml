name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen & ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project LOLMViewDistance.xcodeproj -scheme LOLMViewDistance -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          APP=DerivedData/Build/Products/Release-iphoneos/LOLMViewDistance.app
          # v3.4.1: ldid adhoc 签名 + 完整 entitlements（H5GG 7.9 同款状态，实测 attach 成功）
          # 实测证据：H5GG 7.9 无 CMS 签名（count=5 无 SIGNATURESLOT）但二进制内嵌 entitlements
          # （platform-application/task_for_pid-allow/proc_info-allow/run-unsigned-code/no-container）
          # → TrollStore 安装时 dump 二进制现有 entitlements 沿用（RootHelper dumpEntitlementsFromBinaryAtPath）
          # → task_for_pid 放行。v3.4.0 纯 unsigned 二进制零 entitlements → attach 失败。
          ldid -SLOLMViewDistance/entitlements.plist "$APP/LOLMViewDistance"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r LOLMViewDistance.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOLMViewDistance-v341
          path: LOLMViewDistance.ipa
