name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project LOLMViewDistance.xcodeproj -scheme LOLMViewDistance -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          APP=DerivedData/Build/Products/Release-iphoneos/LOLMViewDistance.app
          # v3.3.11: 纯 unsigned，不做任何预签名。签名交给用户设备上的轻松签（Esign）
          # 用 fake App Store 证书完成 → TrollStore 检测伪证书链（codeCertChainContainsFakeAppStoreExtensions）
          # 走快通道原样安装 → 二进制内完整 entitlements（platform-application/task_for_pid-allow/
          # proc_info-allow/run-unsigned-code/no-container，照 LOLM-22）全部保留 → 权限生效不闪退
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r LOLMViewDistance.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOLMViewDistance-unsigned
          path: LOLMViewDistance.ipa
