name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project LOLMViewDistance.xcodeproj -scheme LOLMViewDistance -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          # 下载 procursus ldid（TrollStore 设备端同款；brew 的 vanilla ldid 2.1.5 对无签名 iOS 二进制 assert 崩溃）
          curl -sL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid
          APP=DerivedData/Build/Products/Release-iphoneos/LOLMViewDistance.app
          # 预签名主二进制（ldid + 完整 entitlements）：TrollStore 安装时会 dump 二进制现有
          # entitlements 并沿用（源码 RootHelper/main.m: dumpEntitlementsFromBinaryAtPath），
          # 所以预签名带 platform-application + no-sandbox → 权限生效（v3.3.8）
          rm -rf "$APP/_CodeSignature"
          ./ldid -S LOLMViewDistance/entitlements.plist "$APP/LOLMViewDistance"
          echo "=== 预签名 entitlements 验证 ==="
          ./ldid -e "$APP/LOLMViewDistance"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r LOLMViewDistance.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOLMViewDistance-unsigned
          path: LOLMViewDistance.ipa
