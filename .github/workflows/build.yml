name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project LOLMViewDistance.xcodeproj -scheme LOLMViewDistance -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/LOLMViewDistance.app Payload/
          zip -r LOLMViewDistance.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOLMViewDistance-unsigned
          path: LOLMViewDistance.ipa
