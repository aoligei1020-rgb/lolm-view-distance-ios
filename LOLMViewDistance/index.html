<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>视距修改 Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:10px;}
.container{width:100%;max-width:420px;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:24px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);}
.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#3498db,#9b59b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.5px;}
.header p{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:10px;text-align:center;border-radius:14px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all 0.3s;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);}
.tab.active{background:linear-gradient(135deg,#3498db,#9b59b6);color:#fff;box-shadow:0 4px 15px rgba(52,152,219,0.3);}
.feature{display:none;}
.feature.active{display:block;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.btn{padding:14px 8px;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.25s;text-align:center;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);letter-spacing:0.3px;}
.btn:active{transform:scale(0.94);}
.btn.primary{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;box-shadow:0 4px 12px rgba(52,152,219,0.25);}
.btn.purple{background:linear-gradient(135deg,#9b59b6,#8e44ad);color:#fff;box-shadow:0 4px 12px rgba(155,89,182,0.25);}
.btn.green{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;}
.btn.orange{background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff;}
.btn.full{grid-column:1/-1;}
.btn.custom{background:rgba(255,255,255,0.12);border:1px dashed rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);}
.status{text-align:center;padding:12px;border-radius:12px;font-size:14px;font-weight:500;margin-top:6px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);min-height:20px;transition:all 0.3s;}
.status.writing{color:#2ecc71;background:rgba(46,204,113,0.12);}
.status.error{color:#e74c3c;background:rgba(231,76,60,0.12);}
.verify-overlay{display:flex;justify-content:center;align-items:center;min-height:300px;flex-direction:column;gap:16px;}
.verify-overlay.hidden{display:none;}
.verify-card{width:100%;max-width:360px;background:rgba(255,255,255,0.06);border-radius:18px;padding:28px 24px;text-align:center;}
.verify-card h2{font-size:20px;color:#fff;margin-bottom:6px;}
.verify-card p{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:18px;}
.verify-card input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:18px;text-align:center;letter-spacing:3px;font-weight:600;outline:none;transition:border 0.3s;}
.verify-card input:focus{border-color:#3498db;}
.verify-card button{background:linear-gradient(135deg,#3498db,#9b59b6);color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px;transition:opacity 0.3s;}
.verify-card button:disabled{opacity:0.5;}
.verify-card .hint{font-size:12px;color:rgba(255,255,255,0.3);margin-top:10px;}
.verify-status{font-size:14px;min-height:22px;margin-top:8px;}
.verify-status.success{color:#2ecc71;}
.verify-status.error{color:#e74c3c;}
.verify-status.loading{color:#f39c12;}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 4s infinite;}
@keyframes twinkle{0%,100%{opacity:0.3;}50%{opacity:1;}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="header">
    <h1>🎯 视距修改 Pro</h1>
    <p id="statusText">视距增强工具</p>
  </div>

  <!-- 验证界面 -->
  <div id="verifyBox" class="verify-overlay">
    <div class="verify-card">
      <h2>🔐 卡密验证</h2>
      <p>请输入卡密激活本工具</p>
      <input type="text" id="cardInput" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" spellcheck="false">
      <div class="verify-status" id="verifyStatus"></div>
      <button id="verifyBtn" onclick="doVerify()">验证</button>
      <div class="hint">一机一码，激活后自动绑定设备</div>
    </div>
  </div>

  <!-- 功能界面 -->
  <div id="featureBox" class="feature">
    <div class="tabs">
      <button class="tab active" data-tab="phone" onclick="switchTab('phone')">📱 手机</button>
      <button class="tab" data-tab="tablet" onclick="switchTab('tablet')">📟 平板</button>
    </div>
    <div id="content-phone" class="feature">
      <div class="grid">
        <button class="btn primary" onclick="setVD(18,'phone','1.0x')">1.0x 默认</button>
        <button class="btn" onclick="setVD(24,'phone','1.5x')">1.5x</button>
        <button class="btn" onclick="setVD(26,'phone','1.6x')">1.6x</button>
        <button class="btn" onclick="setVD(28,'phone','1.7x')">1.7x</button>
        <button class="btn" onclick="setVD(30,'phone','1.8x')">1.8x</button>
        <button class="btn" onclick="setVD(32,'phone','1.9x')">1.9x</button>
        <button class="btn purple" onclick="setVD(34,'phone','2.0x')">2.0x</button>
        <button class="btn custom" onclick="customVD('phone')">✏️ 自定义</button>
        <button class="btn green" onclick="stopVD()">⏹ 停止</button>
      </div>
    </div>
    <div id="content-tablet" class="feature">
      <div class="grid">
        <button class="btn primary" onclick="setVD(21.5,'tablet','1.0x')">1.0x 默认</button>
        <button class="btn" onclick="setVD(24,'tablet','1.5x')">1.5x</button>
        <button class="btn" onclick="setVD(28,'tablet','1.6x')">1.6x</button>
        <button class="btn" onclick="setVD(32,'tablet','1.7x')">1.7x</button>
        <button class="btn purple" onclick="setVD(35,'tablet','1.8x')">1.8x</button>
        <button class="btn custom" onclick="customVD('tablet')">✏️ 自定义</button>
        <button class="btn green" onclick="stopVD()">⏹ 停止</button>
      </div>
    </div>
    <div id="status" class="status">等待初始化...</div>
  </div>
</div>

<script>
// ===== 设备绑定修复补丁 v3.1：cookie 双写 + 原生 UUID 优先 + UI 修复 =====
(function(){
  function _setCookie(name, value, days) {
    try {
      var d = new Date();
      d.setTime(d.getTime() + (days || 3650) * 24 * 60 * 60 * 1000);
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + d.toUTCString() + '; path=/';
    } catch(e) {}
  }
  function _getCookie(name) {
    try {
      var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()\[\]\/\\+^])/g, '\\$1') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    } catch(e) { return null; }
  }
  function _delCookie(name) {
    try {
      var d = new Date();
      d.setTime(0);
      document.cookie = name + '=; expires=' + d.toUTCString() + '; path=/';
    } catch(e) {}
  }
  if (window.localStorage) {
    var _origGet = window.localStorage.getItem.bind(window.localStorage);
    var _origSet = window.localStorage.setItem.bind(window.localStorage);
    var _origRemove = window.localStorage.removeItem.bind(window.localStorage);
    window.localStorage.getItem = function(k) {
      var v = _origGet(k);
      if (v === null && k && k.indexOf('lolm_') === 0) v = _getCookie('ls_' + k);
      return v;
    };
    window.localStorage.setItem = function(k, v) {
      _origSet(k, v);
      if (k && k.indexOf('lolm_') === 0) _setCookie('ls_' + k, String(v), 3650);
    };
    window.localStorage.removeItem = function(k) {
      _origRemove(k);
      if (k && k.indexOf('lolm_') === 0) _delCookie('ls_' + k);
    };
  }
})();
// 原生 UUID 优先：App 内通过本地 HTTP /native-uuid 读取 NSUserDefaults 持久化 UUID（永不丢失）
setTimeout(function(){
  try {
    if (window && !window.__uuidPatched) {
      var _origUUID = window.getDeviceUUID;
      window.getDeviceUUID = function() {
        try {
          var x = new XMLHttpRequest();
          x.open('GET', location.origin + '/native-uuid', false);
          x.send();
          if (x.status === 200) {
            var r = JSON.parse(x.responseText);
            if (r && r.uuid) {
              // 三处一致：原生 UUID 同步写回 localStorage（cookie 双写 hook 自动兜底）
              try { window.localStorage.setItem('lolm_device_uuid', r.uuid); } catch(e2) {}
              return r.uuid;
            }
          }
        } catch(e) {}
        return _origUUID ? _origUUID() : null;
      };
      window.__uuidPatched = true;
    }
  } catch(e) {}
}, 300);
// UI 修复：覆盖 switchTab（只切内容区，不误伤 featureBox）+ 默认激活手机内容区
setTimeout(function(){
  try {
    if (window && !window.__switchPatched) {
      window.switchTab = function(tab) {
        try {
          currentDevice = tab; // 与原版行为一致（防御：后续逻辑可能依赖）
          var tabs = document.querySelectorAll('.tab');
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].dataset.tab === tab);
          }
          var cp = document.getElementById('content-phone');
          var ct = document.getElementById('content-tablet');
          if (cp) cp.classList.remove('active');
          if (ct) ct.classList.remove('active');
          var target = document.getElementById('content-' + tab);
          if (target) target.classList.add('active');
        } catch(e) {}
      };
      // 默认激活手机内容区（featureBox 显示后按钮直接可见）
      var cp2 = document.getElementById('content-phone');
      if (cp2 && !cp2.classList.contains('active')) cp2.classList.add('active');
      window.__switchPatched = true;
    }
  } catch(e) {}
}, 400);
</script>
<script>
// ================================================================
// 配置
// ================================================================

// 卡密验证服务器地址
var API_BASE = 'https://lolm-card-verify.pages.dev';

// HMAC 共享密钥（与 Worker 中一致）
var SHARED_KEY = 'a1bf00639a86c9dd86efd7aae2e2985b';

// 指针链（从 IPA 提取）
var POINTER_PHONE = { base: 0xE639F38, offsets: [0xB8, 0x30, 0x320] };
var POINTER_TABLET = { base: 0xE639F38, offsets: [0xB8, 0x30, 0x328] };

// ================================================================
// 卡密验证系统
// ================================================================

// 获取设备 UUID（优先用已有的，否则生成新的一直保存）
function getDeviceUUID() {
  var key = 'lolm_device_uuid';
  var uuid = localStorage.getItem(key);
  if (!uuid) {
    uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
    localStorage.setItem(key, uuid);
  }
  return uuid;
}

// HMAC-SHA256（使用 Web Crypto API）
async function hmacSign(key, data) {
  var enc = new TextEncoder();
  var cryptoKey = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(data));
  var hex = '';
  new Uint8Array(sig).forEach(function(b) { hex += (b >> 4).toString(16) + (b & 0xf).toString(16); });
  return hex;
}

// 验证卡密
async function verifyCard(code) {
  var deviceUUID = getDeviceUUID();
  var timestamp = Date.now().toString();
  var signature = await hmacSign(SHARED_KEY, code + deviceUUID + timestamp);

  try {
    var res = await fetch(API_BASE + '/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card: code, device_uuid: deviceUUID, timestamp: timestamp, signature: signature })
    });
    var data = await res.json();
    return data;
  } catch(e) {
    return { success: false, message: '网络错误: ' + e.message };
  }
}

// 验证按钮
async function doVerify() {
  var input = document.getElementById('cardInput');
  var status = document.getElementById('verifyStatus');
  var btn = document.getElementById('verifyBtn');
  var code = input.value.trim().toUpperCase();

  if (!code) { status.textContent = '请输入卡密'; status.className = 'verify-status error'; return; }
  if (code.length < 8) { status.textContent = '卡密格式不正确'; status.className = 'verify-status error'; return; }

  btn.disabled = true;
  status.textContent = '⏳ 验证中...';
  status.className = 'verify-status loading';

  var result = await verifyCard(code);

  if (result.success) {
    // 保存验证凭据
    localStorage.setItem('lolm_session_token', result.data.token);
    localStorage.setItem('lolm_session_sig', result.data.signature);
    localStorage.setItem('lolm_session_expiry', result.data.expiry);
    localStorage.setItem('lolm_verified_card', code);

    status.textContent = '✅ 验证成功！';
    status.className = 'verify-status success';

    setTimeout(function() {
      document.getElementById('verifyBox').classList.add('hidden');
      document.getElementById('featureBox').classList.add('active');
      startFeature();
    }, 600);
  } else {
    status.textContent = '❌ ' + (result.message || '验证失败');
    status.className = 'verify-status error';
    btn.disabled = false;
  }
}

// 检查已有会话：始终显示卡密验证界面（session 有效时预填上次卡密，点验证即进入）
async function checkSession() {
  var token = localStorage.getItem('lolm_session_token');
  var sig = localStorage.getItem('lolm_session_sig');
  var expiry = localStorage.getItem('lolm_session_expiry');

  var status = document.getElementById('verifyStatus');
  if (token && sig && expiry && parseInt(expiry) > Date.now()) {
    // 已有有效 session：预填上次卡密，提示直接验证进入
    var lastCard = localStorage.getItem('lolm_verified_card');
    if (lastCard) {
      var input = document.getElementById('cardInput');
      if (input) input.value = lastCard;
    }
    if (status) {
      status.textContent = '✅ 检测到已激活卡密，点验证即可进入';
      status.className = 'verify-status success';
    }
  } else {
    // 清除过期 token
    localStorage.removeItem('lolm_session_token');
    localStorage.removeItem('lolm_session_sig');
    localStorage.removeItem('lolm_session_expiry');
    if (status) {
      status.textContent = '';
      status.className = 'verify-status';
    }
  }
}

// ================================================================
// 视距修改功能（核心逻辑：自动绑定 + 指针链写入）
// ================================================================

var currentDevice = 'phone';
var currentValue = null;
var writeTimer = null;
var currentAddr = null;
var refreshTimer = null;

// ===== 自动绑定 LOLM 进程（3秒轮询，已验证可自动绑定）=====
function autoBind() {
  try {
    var procs = h5gg.getProcList('lolm');
    if (!procs || !procs[0]) {
      setTimeout(autoBind, 3000);
      return;
    }
    var pid = procs[0].pid;
    h5gg.setTargetProc(pid);
    h5gg.clearResults();
    setStatus('✅ 已连接游戏 pid=' + pid + '，选择视距倍数', '');
    resolveAddress();
  } catch(e) {
    setTimeout(autoBind, 3000);
  }
}

// ===== 解析指针链得到最终地址 =====
function resolveAddress() {
  try {
    var chain = currentDevice === 'phone' ? POINTER_PHONE : POINTER_TABLET;
    var ranges = h5gg.getRangesList('UnityFramework');
    if (!ranges || ranges.length === 0) {
      return null;
    }
    var addr = Number(ranges[0].start) + chain.base;
    var offs = chain.offsets;
    for (var i = 0; i < offs.length; i++) {
      var pv = h5gg.getValue(addr, 'I64');
      if (pv === undefined || pv === null) throw new Error('pointer chain broken');
      addr = Number(pv) + offs[i];
    }
    currentAddr = addr;
    return addr;
  } catch(e) {
    return null;
  }
}

// ===== 视距写入（100ms 循环）=====
function applyView(val, label) {
  currentValue = val;
  stopWrite();
  var addr = resolveAddress();
  if (addr === null) {
    setStatus('❌ 地址无效：请确认 LOLM 已进入对局/训练场', 'error');
    return;
  }
  writeTimer = setInterval(function() {
    try {
      var v = h5gg.getValue(currentAddr, 'F32');
      if (v !== undefined && v !== null) {
        h5gg.setValue(currentAddr, currentValue, 'F32');
      }
    } catch(e) { }
  }, 100);
  setStatus('✅ ' + (currentDevice==='phone'?'手机':'平板') + '视距: ' + label, 'writing');
}

function stopWrite() {
  if (writeTimer) { clearInterval(writeTimer); writeTimer = null; }
}

// ===== 界面交互 =====
function setVD(val, type, label) {
  currentDevice = type;
  applyView(val, label);
}

function customVD(type) {
  var def = type==='phone' ? '18' : '21.5';
  var val = prompt('输入视距值(默认' + def + '):', def);
  if (val !== null && val !== '') {
    var n = parseFloat(val);
    if (!isNaN(n) && n > 0) { setVD(n, type, val + 'x'); }
    else { setStatus('无效输入', 'error'); }
  }
}

function stopVD() {
  stopWrite();
  setStatus('⏹ 已停止写入', '');
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'status';
  if (type) el.classList.add(type);
}

function switchTab(tab) {
  currentDevice = tab;
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.feature').forEach(function(c) {
    c.classList.remove('active');
  });
  document.getElementById('content-' + tab).classList.add('active');
}

function startFeature() {
  setStatus('⏳ 连接游戏中...', '');
  setTimeout(autoBind, 500);
  // 周期刷新地址（模块基址可能变化）
  if (!refreshTimer) {
    refreshTimer = setInterval(function() {
      if (currentValue !== null && writeTimer) {
        if (resolveAddress() === null) stopWrite();
      }
    }, 5000);
  }
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
  // 创建星星背景
  var starsEl = document.getElementById('stars');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random() * 2 + 0.5;
    s.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*4)+'s';
    starsEl.appendChild(s);
  }

  // 检查已有会话，否则显示验证
  checkSession();

  // 回车验证
  document.getElementById('cardInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doVerify();
  });

  // 自动大写 + 自动加 -
  document.getElementById('cardInput').addEventListener('input', function(e) {
    var v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length > 4) { v = v.substring(0,4) + '-' + v.substring(4,8); }
    this.value = v;
  });
});

window.setVD = setVD;
window.customVD = customVD;
window.stopVD = stopVD;
window.switchTab = switchTab;
window.doVerify = doVerify;
window.pid = autoBind;
</script>
</body>
</html>
